name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  migrate:
    name: Appliquer les migrations D1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Wrangler
        run: npm install -g wrangler

      - name: Appliquer schema.sql sur D1 (remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          wrangler d1 execute calendrier-americanfullfightingbonsdb \
            --file=schema.sql \
            --remote

  deploy:
    name: Déployer le Worker
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Wrangler
        run: npm install -g wrangler

      - name: Déployer le Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: wrangler deploy

      - name: Injecter le secret ADMIN_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: echo "${{ secrets.CF_ADMIN_TOKEN }}" | wrangler secret put ADMIN_TOKEN

      - name: Injecter le secret SESSION_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: echo "${{ secrets.CF_SESSION_SECRET }}" | wrangler secret put SESSION_SECRET
