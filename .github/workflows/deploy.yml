name: Deploy — Cloudflare Worker & D1

on:
  push:
    branches:
      - main          # déploiement automatique sur push dans main
  workflow_dispatch:  # déclenchement manuel depuis l'onglet Actions de GitHub

jobs:
  # ════════════════════════════════════════════════════════════════
  #  JOB 1 : Appliquer le schéma SQL sur D1
  #  (uniquement si schema.sql a changé, ou déclenchement manuel)
  # ════════════════════════════════════════════════════════════════
  migrate:
    name: Migrate D1 schema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Apply schema.sql to D1 (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          wrangler d1 execute calendrier-americanfullfightingbonsdb \
            --file=schema.sql \
            --remote

  # ════════════════════════════════════════════════════════════════
  #  JOB 2 : Déployer le Worker
  # ════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    needs: migrate       # attend que la migration soit terminée

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy

      - name: Set ADMIN_TOKEN secret on Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "${{ secrets.CF_ADMIN_TOKEN }}" | \
            wrangler secret put ADMIN_TOKEN \
              --name calendrier-americanfullfightingbons
