name = "calendrier-americanfullfightingbons"
main = "worker.js"
compatibility_date = "2025-12-17"
compatibility_flags = ["nodejs_compat"]

# ── Base de données D1 ───────────────────────────────────────────────────────
[[d1_databases]]
binding        = "DB"
database_name  = "calendrier-americanfullfightingbonsdb"
database_id    = "b146bb47-b1cc-48db-9e7c-0c8223a9fee2"

# ── Stockage R2 — affiches d'événements ──────────────────────────────────────
# Bucket à créer une seule fois avant le premier déploiement avec cette
# fonctionnalité :
#   wrangler r2 bucket create affbc-calendrier-posters
[[r2_buckets]]
binding      = "POSTERS"
bucket_name  = "affbc-calendrier-posters"

# ── Variables d'environnement non-sensibles ──────────────────────────────────
[vars]
ENVIRONMENT = "production"

# ── Cron quotidien — archivage + suppression des événements terminés depuis
#    plus de 5 jours (cf. purgeExpiredEvents dans worker.js). Les inscriptions
#    sont archivées (snapshot JSON + export CSV) avant suppression, jamais
#    perdues. Exécution à 3h du matin (heure UTC), en dehors des heures
#    d'usage du calendrier.
[triggers]
crons = ["0 3 * * *"]

# ── Secrets (définis via GitHub Secrets, jamais ici) ────────────────────────
# ADMIN_TOKEN    → injecté par le workflow GitHub Actions (printf sans newline)
# SESSION_SECRET → injecté par le workflow GitHub Actions (32+ caractères).
#                  Signe le cookie de session admin (HMAC). Sans lui, le
#                  login échoue toujours (500) même avec le bon ADMIN_TOKEN.
